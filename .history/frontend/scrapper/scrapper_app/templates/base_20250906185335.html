<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Comparativa de Precios
      {% endblock %}
    </title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
      crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'scrapper_app/css/style.css' %}"> 
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Comparativa Precios</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/hipermaxi">Hipermaxi</a></li>
            <li class="nav-item"><a class="nav-link" href="/amarket">Amarket</a></li>
            <li class="nav-item"><a class="nav-link" href="/fidalga">Fidalga</a></li>
          </ul>

          <form class="d-flex ms-auto" role="search" action="{% url 'buscar' %}" method="get">
            <input class="form-control me-2" type="search" name="q" 
              placeholder="Buscar Producto" aria-label="Search" value="{{ request.GET.q }}">
            <button class="btn btn-outline-success" type="submit">Buscar</button>
          </form>
        </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 bg-light mt-5">
      <p class="mb-0">© 2025 Comparativa Precios | Proyecto UPB</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
