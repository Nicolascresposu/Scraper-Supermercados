{% extends "base.html" %}

{% block title %}Hipermaxi{% endblock %}

{% block content %}
<h2 class="mt-4">Productos de Hipermaxi</h2>
<div class="row">
  {% for producto in productos %}
    <div class="col-4 my-2">
      <div class="card">
        <div class="card-body">
          <img src="{{producto.imageLink}}" class="img-fluid rounded" alt="  ">
          <h5 class="card-title">{{producto.name}}</h5>
          <p><span class="badge bg-secondary">{{producto.price}} Bs.</span></p>
        </div>
      </div>    
    </div>
  {% empty %}
    <tr>
      <td colspan="2">No hay productos disponibles</td>
    </tr>
  {% endfor %}
</div>
