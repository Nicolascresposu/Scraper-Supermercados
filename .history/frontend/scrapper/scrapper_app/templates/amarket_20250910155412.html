{% extends "base.html" %}

{% block title %}Amarket{% endblock %}

{% block content %}
<h2 class="mt-4">Productos de Amarket</h2>
<div class="row">
  {% for producto in productos %}
    <div class="col-md-4 col-sm-6 mb-4">
      <div class="card h-100 d-flex flex-column">
        <div class="card-body d-flex flex-column">
          <img src="{{producto.image_link}}" class="img-fluid rounded w-100 h-100 object-fit-cover" alt="  ">
          <h5 class="card-title">{{producto.nombre}}</h5>
          <p><span class="badge bg-secondary">{{producto.precio}} Bs.</span></p>
        </div>
      </div>    
    </div>
  {% empty %}
    <tr>
      <td colspan="2">No hay productos disponibles</td>
    </tr>
  {% endfor %}
</div>
