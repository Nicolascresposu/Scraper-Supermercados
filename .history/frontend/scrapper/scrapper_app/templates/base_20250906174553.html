<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Comparativa de Precios
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
      crossorigin="anonymous">
    <style>
      body {
        background: #f8f9fa;
      }
      .navbar {
        background: linear-gradient(90deg, #007bff, #00c6ff);
      }
      .navbar-brand, .nav-link {
        color: white !important;
        font-weight: 500;
      }
      .hero {
        background: url("https://images.unsplash.com/photo-1606788075761-6f2a76e91f6d") center/cover no-repeat;
        color: white;
        padding: 100px 20px;
        text-align: center;
        border-radius: 0 0 20px 20px;
      }
      .hero h1 {
        font-size: 3rem;
        font-weight: bold;
      }
      .hero p {
        font-size: 1.25rem;
      }
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/">Comparativa Precios</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/hipermaxi">Hipermaxi</a></li>
            <li class="nav-item"><a class="nav-link" href="/amarket">Amarket</a></li>
            <li class="nav-item"><a class="nav-link" href="/fidalga">Fidalga</a></li>
          </ul>
          </div>
          <nav class="navbar navbar-light bg-light">
            <form class="form-inline">
              <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Buscar Producto">
              <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Buscar</button>
            </form>
          </nav>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 bg-light mt-5">
      <p class="mb-0">© 2025 Comparativa Precios | Proyecto UPB</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
